<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning wheel tombola</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f1eb;
      color: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: start;
    }

    .wheel-card,
    .panel {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
    }

    .intro {
      margin: 0 0 24px;
      color: #555;
      font-size: 16px;
    }

    .wheel-wrap {
      position: relative;
      width: min(680px, 100%);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.22));
    }

    .pointer {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 44px solid #151515;
      z-index: 5;
    }

    .center-button {
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 8px solid #ffffff;
      background: #151515;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 4;
    }

    .center-button:hover {
      transform: scale(1.04);
      background: #303030;
    }

    .center-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .winner-box {
      text-align: center;
      min-height: 72px;
      padding: 18px;
      border-radius: 18px;
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
    }

    .winner-label {
      margin: 0 0 6px;
      color: #666;
      font-size: 14px;
    }

    .winner-name {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 800;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .panel p {
      margin: 0 0 16px;
      color: #555;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 420px;
      resize: vertical;
      border: 1px solid #d6d6d6;
      border-radius: 16px;
      padding: 14px;
      font: 15px/1.5 Arial, sans-serif;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button.secondary {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: #eeeeee;
      color: #1f1f1f;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary:hover {
      background: #dddddd;
    }

    .count {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .center-button {
        width: 108px;
        height: 108px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="wheel-card">
      <h1>Tombola</h1>
      <p class="intro">Klicka på snurra för att slumpa fram ett namn.</p>

      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
        <button class="center-button" id="spinButton">Snurra</button>
      </div>

      <div class="winner-box" aria-live="polite">
        <p class="winner-label">Vinnare</p>
        <p class="winner-name" id="winnerName">Ingen vald ännu</p>
      </div>
    </section>

    <aside class="panel">
      <h2>Namnlista</h2>
      <p>Ett namn per rad. Uppdatera listan om du vill lägga till eller ta bort personer.</p>
      <textarea id="namesInput"></textarea>
      <div class="actions">
        <button class="secondary" id="updateButton">Uppdatera hjulet</button>
        <button class="secondary" id="removeWinnerButton">Ta bort vinnaren</button>
        <button class="secondary" id="resetButton">Återställ listan</button>
      </div>
      <div class="count" id="countText"></div>
    </aside>
  </main>

  <script>
    const defaultNames = [
      "Rickard Mastola",
      "Stanislaw Lux",
      "Frida Andersson",
      "Camilla Rosendrake",
      "Jari Forsman",
      "Åsa Sergelius",
      "Alice Öberg",
      "Alvin Wedstedt",
      "Oscar Ragnar Alfons Kling",
      "Malin Bergström",
      "Marlene Hofmann",
      "Therese Larsson",
      "Max Hökdal",
      "Linda Nordin",
      "Gina Frost",
      "Tanja Sova",
      "Fredrik Eklund",
      "Johan Ringblom",
      "Linda Stockenberg",
      "Matilda O'Connor",
      "Pontus Blomkvist",
      "Camilla Delac",
      "Elin Ericsson",
      "Michaela Lindbäck",
      "Irja Hökås",
      "Elin Thurang",
      "Marica Anderbrink",
      "Carl Tillenius",
      "Stefan Eriksson",
      "Joakim Borkovic",
      "Anne-Marie Pettersson",
      "Susanna Perämäki",
      "Ulrica Sjöberg",
      "Josefin Hultmar",
      "Mikael Örn",
      "Elin Lundberg",
      "Josefin Holmgren",
      "Linnéa Lindgren",
      "Åsa Salo",
      "Anders Lundgren",
      "Ulrica Sjöberg",
      "Hakan Ringkvist",
      "Jari Puustinen",
      "Simon Glimtoft",
      "Lisa Lövenros",
      "Christoffer Andersson",
      "Saga Chressman",
      "Maria Fehne",
      "Andréas Ljungman",
      "Linda Lundqvist",
      "Diyar Alis",
      "Jens Carlberg",
      "Mattias Zingmark",
      "Mats Karlsson",
      "Johan Hermansson",
      "Nadja Olsson",
      "Lotta Larsson",
      "Alexander Widerberg",
      "Karin Jonasson",
      "Eric Johansson",
      "Christin Widerberg",
      "Maria Brostedt",
      "Slawik Misiak",
      "Susanne Heldring",
      "Marcus Forss",
      "Annica Åkerblad"
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const updateButton = document.getElementById("updateButton");
    const removeWinnerButton = document.getElementById("removeWinnerButton");
    const resetButton = document.getElementById("resetButton");
    const namesInput = document.getElementById("namesInput");
    const winnerName = document.getElementById("winnerName");
    const countText = document.getElementById("countText");

    let names = [...defaultNames];
    let rotation = 0;
    let isSpinning = false;
    let latestWinner = "";

    const colors = [
      "#f7c948", "#f97068", "#57c7ff", "#7bd88f", "#c084fc", "#ff9f43",
      "#4dd4ac", "#ff6b9a", "#94a3b8", "#facc15", "#60a5fa", "#fb7185"
    ];

    function normalizeNames(value) {
      return value
        .split("\n")
        .map(name => name.trim())
        .filter(Boolean);
    }

    function updateCount() {
      countText.textContent = `${names.length} namn i hjulet`;
    }

    function drawWheel() {
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = width / 2 - 28;

      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotation);

      if (names.length === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#eeeeee";
        ctx.fill();
        ctx.fillStyle = "#555";
        ctx.textAlign = "center";
        ctx.font = "bold 34px Arial";
        ctx.fillText("Lägg till namn", 0, 0);
        ctx.restore();
        return;
      }

      const slice = (Math.PI * 2) / names.length;

      names.forEach((name, index) => {
        const start = index * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#151515";
        ctx.font = names.length > 45 ? "bold 17px Arial" : "bold 22px Arial";

        const visibleName = name.length > 26 ? `${name.slice(0, 24)}…` : name;
        const textX = radius * 0.36;
        const maxTextWidth = radius * 0.56;

        ctx.fillText(visibleName, textX, 0, maxTextWidth);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 80, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.restore();
    }

    function getWinnerIndex() {
      const slice = (Math.PI * 2) / names.length;
      const pointerAngle = (Math.PI * 1.5 - rotation) % (Math.PI * 2);
      const normalizedAngle = pointerAngle < 0 ? pointerAngle + Math.PI * 2 : pointerAngle;
      return Math.floor(normalizedAngle / slice);
    }

    function spinWheel() {
      if (isSpinning || names.length === 0) return;

      isSpinning = true;
      spinButton.disabled = true;
      winnerName.textContent = "Snurrar...";

      const startRotation = rotation;
      const extraSpins = 7 + Math.random() * 4;
      const randomStop = Math.random() * Math.PI * 2;
      const targetRotation = startRotation + extraSpins * Math.PI * 2 + randomStop;
      const duration = 5200;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);

        rotation = startRotation + (targetRotation - startRotation) * eased;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          rotation = targetRotation % (Math.PI * 2);
          drawWheel();
          const winnerIndex = getWinnerIndex();
          latestWinner = names[winnerIndex];
          winnerName.textContent = latestWinner;
          isSpinning = false;
          spinButton.disabled = false;
        }
      }

      requestAnimationFrame(animate);
    }

    function updateWheelFromInput() {
      names = normalizeNames(namesInput.value);
      latestWinner = "";
      winnerName.textContent = "Ingen vald ännu";
      updateCount();
      drawWheel();
    }

    function removeWinner() {
      if (!latestWinner) return;
      names = names.filter(name => name !== latestWinner);
      namesInput.value = names.join("\n");
      latestWinner = "";
      winnerName.textContent = "Ingen vald ännu";
      updateCount();
      drawWheel();
    }

    function resetList() {
      names = [...defaultNames];
      namesInput.value = names.join("\n");
      latestWinner = "";
      winnerName.textContent = "Ingen vald ännu";
      updateCount();
      drawWheel();
    }

    spinButton.addEventListener("click", spinWheel);
    updateButton.addEventListener("click", updateWheelFromInput);
    removeWinnerButton.addEventListener("click", removeWinner);
    resetButton.addEventListener("click", resetList);

    namesInput.value = names.join("\n");
    updateCount();
    drawWheel();
  </script>
</body>
</html>
